# Фронт + прокси /api на api:3000. Снаружи сюда ходит только HTTPS-прокси (TLS у него).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;


    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Ссылка инвайта содержит токен в пути — наружу Referer не отдаём.
    add_header Referrer-Policy same-origin always;
    # 'unsafe-inline' только для стилей: Vue пишет style="" для цветов и размеров.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Caddy уже записал сюда адрес клиента; не заменять своим ($proxy_add_x_forwarded_for
        # добавил бы адрес Caddy, и лимиты частоты считали бы всех одним клиентом).
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Для живых обновлений списка покупок (SSE, этап 2).
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 1m;
    }

    # Сборка с хэшами в именах — кэшируется навсегда; index.html и service worker — никогда.
    location /assets/ {
        expires max;
    }
    location = /sw.js {
        expires epoch;
    }
    # mime.types не знает .webmanifest. Тип задаётся только здесь: блок types {} на уровне server
    # ЗАМЕНЯЕТ всю таблицу типов — так уже было, и HTML/JS/sw.js ушли как octet-stream.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        expires epoch;
    }
    location / {
        try_files $uri /index.html;
        expires epoch;
    }
}
